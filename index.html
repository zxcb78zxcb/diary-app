<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#efe9dd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日记本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>我的日记本</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --paper: #fdfbf5;
    --ink: #3a3532;
    --line: #e8e2d5;
    --accent: #b07d4f;
    --muted: #a89f92;
    --bg: #efe9dd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#26241f; --ink:#e6e0d4; --line:#3c382f; --accent:#d9a86e; --muted:#8b8377; --bg:#1b1a17; }
  }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: "Songti SC", "Noto Serif SC", "SimSun", serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px 8px; gap: 10px;
  }
  #dateBig { font-size: 26px; font-weight: bold; letter-spacing: 1px; }
  #dateSub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  #notTodayTag {
    display: none; font-size: 11px; color: #fff; background: var(--accent);
    border-radius: 10px; padding: 2px 9px; margin-left: 8px; vertical-align: middle;
  }
  nav { display: flex; gap: 6px; flex-shrink: 0; }
  nav button {
    font-family: inherit; font-size: 14px; border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px; cursor: pointer;
    color: var(--ink); background: var(--paper);
  }
  nav button:active { border-color: var(--accent); color: var(--accent); }
  main { flex: 1; display: flex; justify-content: center; padding: 4px 14px 6px; min-height: 0; }
  #page {
    width: 100%; max-width: 820px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 3px 14px rgba(90,70,40,.10);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #editor {
    flex: 1; width: 100%; border: none; outline: none; resize: none;
    background: repeating-linear-gradient(var(--paper) 0 33px, var(--line) 33px 34px);
    background-attachment: local;
    font-family: inherit; font-size: 17px; line-height: 34px;
    padding: 0 22px; color: var(--ink);
  }
  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 6px 20px 10px; font-size: 12px; color: var(--muted);
  }
  #syncStatus { cursor: pointer; }
  #syncStatus.err { color: #c0392b; }
  #syncStatus.ok  { color: var(--accent); }
  /* 抽屉 */
  #drawer {
    position: fixed; top: 0; right: -330px; width: 310px; max-width: 86vw; height: 100%;
    background: var(--paper); border-left: 1px solid var(--line);
    box-shadow: -4px 0 16px rgba(0,0,0,.10); transition: right .25s;
    padding: 22px 18px; overflow-y: auto; z-index: 20;
    padding-top: calc(22px + env(safe-area-inset-top));
  }
  #drawer.open { right: 0; }
  #drawer h2 { font-size: 17px; margin-bottom: 12px; }
  .year { font-size: 15px; font-weight: bold; cursor: pointer; padding: 9px 6px; border-bottom: 1px solid var(--line); }
  .year::before { content: "📖 "; }
  .days { display: none; padding: 4px 0 8px; }
  .days.show { display: block; }
  .day { font-size: 14px; padding: 8px 6px 8px 24px; cursor: pointer; border-radius: 6px; }
  .day:active { background: var(--bg); }
  .day.current { color: var(--accent); font-weight: bold; }
  .day span { color: var(--muted); font-size: 12px; margin-left: 6px; }
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.2); display: none; z-index: 10; }
  #mask.show { display: block; }
  /* 日历 */
  #calWrap {
    position: fixed; z-index: 25; display: none;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 8px 30px rgba(60,45,25,.22);
    padding: 14px; width: 320px; max-width: 94vw;
  }
  #calWrap.show { display: block; }
  #calHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  #calHead button {
    font-family: inherit; font-size: 17px; line-height: 1;
    border: none; background: none; color: var(--muted);
    padding: 6px 10px; cursor: pointer; border-radius: 8px;
  }
  #calHead button:active { background: var(--bg); color: var(--accent); }
  #calTitle { font-size: 16px; font-weight: bold; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  #calTitle:active { background: var(--bg); }
  table.cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.cal th { font-size: 11px; color: var(--muted); font-weight: normal; padding-bottom: 6px; }
  table.cal th.we { color: var(--accent); }
  table.cal td { padding: 1px; }
  .cell {
    position: relative; height: 38px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14.5px; cursor: pointer; user-select: none;
  }
  .cell:active { background: var(--bg); }
  .cell.empty { cursor: default; }
  .cell.future { color: var(--line); cursor: default; }
  .cell.future:active { background: none; }
  .cell.today { outline: 1.5px solid var(--accent); outline-offset: -1.5px; }
  .cell.sel { background: var(--accent); color: #fff; font-weight: bold; }
  .cell.has::after {
    content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
  }
  .cell.sel.has::after { background: #fff; }
  #calFoot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  #calFoot button {
    font-family: inherit; font-size: 13px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  /* 照片 */
  #imgStrip {
    display: none; gap: 8px; padding: 8px 14px 2px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  #imgStrip.show { display: flex; }
  .thumb {
    position: relative; flex: 0 0 auto; width: 76px; height: 76px;
    border-radius: 9px; overflow: hidden; border: 1px solid var(--line);
    background: var(--bg); cursor: pointer;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .wait {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--muted);
  }
  #pageTools {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 14px 10px; border-top: 1px solid var(--line);
  }
  #pageTools button {
    font-family: inherit; font-size: 14px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink);
    border-radius: 9px; padding: 8px 14px; cursor: pointer;
  }
  #pageTools button:active { border-color: var(--accent); color: var(--accent); }
  #imgHint { font-size: 11.5px; color: var(--muted); }
  #page.drop { outline: 2px dashed var(--accent); outline-offset: -5px; }
  /* 大图 */
  #viewer {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: rgba(20,16,10,.92);
    flex-direction: column; align-items: center; justify-content: center;
  }
  #viewer.show { display: flex; }
  #viewer img { max-width: 94vw; max-height: 78vh; border-radius: 8px; }
  #viewerBar { display: flex; gap: 10px; margin-top: 16px; }
  #viewerBar button {
    font-family: inherit; font-size: 15px; border: 1px solid rgba(255,255,255,.35);
    background: transparent; color: #fff; border-radius: 9px; padding: 9px 20px; cursor: pointer;
  }
  #viewerBar button.del { border-color: #e08b7a; color: #ffb4a3; }
  /* 对话框 */
  dialog {
    border: 1px solid var(--line); border-radius: 14px; padding: 22px;
    background: var(--paper); color: var(--ink); max-width: 92vw; width: 420px;
    font-family: inherit;
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { font-size: 18px; margin-bottom: 6px; }
  dialog p.hint { font-size: 12.5px; color: var(--muted); line-height: 1.7; margin-bottom: 14px; }
  dialog label { display: block; font-size: 13px; margin: 10px 0 4px; }
  dialog input {
    width: 100%; font-family: inherit; font-size: 15px; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
  }
  .row { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .row button {
    flex: 1; font-family: inherit; font-size: 15px; padding: 11px;
    border-radius: 9px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); cursor: pointer; min-width: 100px;
  }
  .row button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #cfgMsg { font-size: 13px; margin-top: 10px; min-height: 18px; }
  a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div>
    <div id="dateBig">——<span id="notTodayTag">往日</span></div>
    <div id="dateSub"></div>
  </div>
  <nav>
    <button id="todayBtn">今天</button>
    <button id="calBtn" title="日历">📅</button>
    <button id="listBtn" title="历年日记">📚</button>
    <button id="cfgBtn" title="设置">⚙️</button>
  </nav>
</header>

<div id="calWrap">
  <div id="calHead">
    <button id="calPrev" title="上个月">‹</button>
    <div id="calTitle"></div>
    <button id="calNext" title="下个月">›</button>
  </div>
  <table class="cal">
    <thead><tr>
      <th class="we">日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th class="we">六</th>
    </tr></thead>
    <tbody id="calBody"></tbody>
  </table>
  <div id="calFoot">
    <span id="calCount"></span>
    <button id="calToday">回到今天</button>
  </div>
</div>

<main>
  <div id="page">
    <textarea id="editor" placeholder="写点什么吧……" spellcheck="false"></textarea>
    <div id="imgStrip"></div>
    <div id="pageTools">
      <button id="addImgBtn">📷 加照片</button>
      <span id="imgHint"></span>
      <input type="file" id="imgFile" accept="image/*" multiple hidden>
    </div>
  </div>
</main>

<div id="viewer">
  <img id="viewerImg" alt="日记照片">
  <div id="viewerBar">
    <button id="viewerClose">关闭</button>
    <button id="viewerDel" class="del">删除这张</button>
  </div>
</div>

<footer>
  <span id="syncStatus">未设置云同步 · 点这里设置</span>
  <span id="saveStatus"></span>
</footer>

<div id="mask"></div>
<div id="drawer">
  <h2>📚 历年日记</h2>
  <div id="yearList"></div>
</div>

<dialog id="cfgDlg">
  <h2>云同步设置</h2>
  <p class="hint">日记会存进你自己的 GitHub 私有仓库，手机和电脑打开同一个网址就自动同步。<br>
  具体怎么建仓库、怎么生成 Token，见「使用说明」。</p>
  <label>GitHub 用户名</label>
  <input id="cfgOwner" placeholder="例如 yuu1126" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label>仓库名</label>
  <input id="cfgRepo" placeholder="例如 my-diary" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label>访问 Token</label>
  <input id="cfgToken" type="password" placeholder="github_pat_… 或 ghp_…" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div id="cfgMsg"></div>
  <div class="row">
    <button id="cfgSave" class="primary">保存并测试连接</button>
    <button id="cfgClose">关闭</button>
  </div>
  <div class="row">
    <button id="cfgExport">导出备份</button>
    <button id="cfgImport">导入备份</button>
    <input type="file" id="cfgFile" accept=".json" hidden>
  </div>
  <p class="hint" style="margin:10px 0 0">备份只含文字。照片本来就存在 GitHub 仓库的 <code>年份/img/</code> 里，去那儿下载即可。</p>
</dialog>

<script src="sync-core.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const WEEK = ['日','一','二','三','四','五','六'];
const S = SyncCore;

/* ================= 本地存储 ================= */
const TXT = d => 'diary:' + d;         // 正文
const MET = d => 'diaryM:' + d;        // {t 本机修改时间, base 上次同步点, sha GitHub 文件 sha}
const CFG = 'diaryCfg';

function getText(d) { return localStorage.getItem(TXT(d)) || ''; }
function getMeta(d) { try { return JSON.parse(localStorage.getItem(MET(d))) || {}; } catch { return {}; } }
function setMeta(d, m) { localStorage.setItem(MET(d), JSON.stringify(m)); }
function putText(d, text, t) {
  const m = getMeta(d);
  if (text) localStorage.setItem(TXT(d), text);
  else localStorage.removeItem(TXT(d));
  m.t = t || Date.now();
  setMeta(d, m);
}
function allDates() {
  const set = new Set();
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('diary:'))  set.add(k.slice(6));
    if (k.startsWith('diaryM:')) set.add(k.slice(7));
  }
  return [...set].filter(S.isDateKey);
}
let cfg = {};
try { cfg = JSON.parse(localStorage.getItem(CFG)) || {}; } catch {}

/* 这一天有没有东西（正文或照片），日历的小圆点看它 */
function imgsOf(d) { return getMeta(d).imgs || []; }
function hasEntry(d) { return !!getText(d) || imgsOf(d).length > 0; }

/* ================= 照片：存在 IndexedDB 里，断网也看得到 ================= */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('diary-img', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('blobs');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function imgPut(name, blob) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction('blobs', 'readwrite');
    t.objectStore('blobs').put(blob, name);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function imgGet(name) {
  const db = await idb();
  return new Promise((res, rej) => {
    const q = db.transaction('blobs').objectStore('blobs').get(name);
    q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error);
  });
}
async function imgDel(name) {
  const db = await idb();
  return new Promise((res) => {
    const t = db.transaction('blobs', 'readwrite');
    t.objectStore('blobs').delete(name);
    t.oncomplete = res; t.onerror = res;
  });
}

/* 手机拍的照片动辄四五兆，先缩到长边 1600、压成 JPEG，省流量也省仓库空间 */
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const MAX = 1600;
      let { width: w, height: h } = im;
      const scale = Math.min(1, MAX / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h);
      const tryQ = q => cv.toBlob(b => {
        if (!b) return reject(new Error('图片处理失败'));
        // GitHub 接口对单文件有大小限制，压到 900KB 以内才稳
        if (b.size > 900 * 1024 && q > 0.45) tryQ(q - 0.12);
        else resolve(b);
      }, 'image/jpeg', q);
      tryQ(0.82);
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('这个文件不是图片')); };
    im.src = url;
  });
}

const thumbURLs = new Map();          // name -> objectURL，切页时回收
function freeThumbs() {
  for (const u of thumbURLs.values()) URL.revokeObjectURL(u);
  thumbURLs.clear();
}

async function addImages(files) {
  const list = [...files].filter(f => f && f.type.startsWith('image/'));
  if (!list.length) return;
  const day = viewKey;
  $('imgHint').textContent = `处理中… 0/${list.length}`;
  let done = 0;
  for (const f of list) {
    try {
      const blob = await shrink(f);
      const name = S.newImgName(day);
      await imgPut(name, blob);
      const m = getMeta(day);
      m.imgs = (m.imgs || []).concat(name);
      m.t = Date.now();
      setMeta(day, m);
    } catch (e) {
      $('imgHint').textContent = '✗ ' + e.message;
    }
    $('imgHint').textContent = `处理中… ${++done}/${list.length}`;
  }
  $('imgHint').textContent = done ? `加了 ${done} 张` : '';
  setTimeout(() => { if ($('imgHint').textContent.startsWith('加了')) $('imgHint').textContent = ''; }, 2500);
  if (day === viewKey) renderStrip();
  if ($('calWrap').classList.contains('show')) renderCal();
  scheduleSync(2000);
}

async function renderStrip() {
  const day = viewKey;
  const names = imgsOf(day);
  const strip = $('imgStrip');
  strip.classList.toggle('show', names.length > 0);
  strip.innerHTML = '';
  freeThumbs();
  for (const name of names) {
    const box = document.createElement('div');
    box.className = 'thumb';
    const wait = document.createElement('div');
    wait.className = 'wait';
    wait.textContent = '…';
    box.appendChild(wait);
    strip.appendChild(box);
    const blob = await imgGet(name);
    if (day !== viewKey) return;               // 期间翻页了，丢弃
    if (blob) {
      const url = URL.createObjectURL(blob);
      thumbURLs.set(name, url);
      const im = document.createElement('img');
      im.src = url; im.alt = '日记照片';
      box.innerHTML = '';
      box.appendChild(im);
      box.onclick = () => openViewer(name, url);
    } else {
      wait.textContent = '待同步';             // 别的设备加的，还没下下来
    }
  }
}

/* ---- 看大图 / 删除 ---- */
let viewerName = null;
function openViewer(name, url) {
  viewerName = name;
  $('viewerImg').src = url;
  $('viewer').classList.add('show');
}
function closeViewer() {
  $('viewer').classList.remove('show');
  $('viewerImg').removeAttribute('src');
  viewerName = null;
}
$('viewerClose').onclick = closeViewer;
$('viewer').onclick = e => { if (e.target === $('viewer')) closeViewer(); };
$('viewerDel').onclick = async () => {
  if (!viewerName) return;
  if (!confirm('删掉这张照片？手机和电脑上都会一起删掉。')) return;
  const day = viewKey, name = viewerName;
  const m = getMeta(day);
  m.imgs = (m.imgs || []).filter(n => n !== name);
  m.gone = (m.gone || []).concat(name);
  m.t = Date.now();
  setMeta(day, m);
  await imgDel(name);
  closeViewer();
  renderStrip();
  if ($('calWrap').classList.contains('show')) renderCal();
  scheduleSync(1500);
};

/* ---- 三种加照片的方式：按钮（手机相册/拍照）、粘贴截图、拖进来 ---- */
$('addImgBtn').onclick = () => $('imgFile').click();
$('imgFile').onchange = e => { addImages(e.target.files); e.target.value = ''; };
document.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.files;
  if (items && items.length && [...items].some(f => f.type.startsWith('image/'))) {
    e.preventDefault();
    addImages(items);
  }
});
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
    e.preventDefault(); $('page').classList.add('drop');
  }
}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  if (ev === 'drop' && e.dataTransfer && e.dataTransfer.files.length) {
    e.preventDefault(); addImages(e.dataTransfer.files);
  }
  if (ev === 'drop' || e.relatedTarget === null) $('page').classList.remove('drop');
}));

/* ================= 日期 ================= */
function keyOf(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayKey() { return keyOf(new Date()); }
function showDate(key) {
  const [y,m,d] = key.split('-').map(Number);
  $('dateBig').firstChild.textContent = `${y}年${m}月${d}日`;
  $('dateSub').textContent = `星期${WEEK[new Date(y, m-1, d).getDay()]} · 第 ${y} 本`;
  $('notTodayTag').style.display = (key === todayKey()) ? 'none' : 'inline';
}

/* ================= GitHub API ================= */
function api(path, opts = {}) {
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
  return fetch(url, Object.assign({
    headers: {
      'Authorization': 'Bearer ' + cfg.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }
  }, opts));
}
async function ghGet(path) {
  const r = await api(path + '?ref=' + encodeURIComponent(cfg.branch || 'main') + '&t=' + Date.now());
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('读取失败 ' + r.status + (r.status === 401 ? '（Token 不对或已过期）' : ''));
  const j = await r.json();
  return { text: S.b64decode(j.content), sha: j.sha };
}
async function ghPut(path, text, sha, msg) {
  const body = { message: msg || ('日记 ' + path), content: S.b64encode(text), branch: cfg.branch || 'main' };
  if (sha) body.sha = sha;
  let r = await api(path, { method: 'PUT', body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) {          // sha 过期，重取后再试一次
    const cur = await ghGet(path);
    if (cur) { body.sha = cur.sha; } else { delete body.sha; }
    r = await api(path, { method: 'PUT', body: JSON.stringify(body) });
  }
  if (!r.ok) throw new Error('写入失败 ' + r.status);
  return (await r.json()).content.sha;
}

/* ---- 图片是二进制，走单独的收发 ---- */
async function ghPutBlob(path, blob) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  let bin = '';
  for (let i = 0; i < buf.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  const body = { message: '照片 ' + path, content: btoa(bin), branch: cfg.branch || 'main' };
  const r = await api(path, { method: 'PUT', body: JSON.stringify(body) });
  if (!r.ok && r.status !== 422) throw new Error('照片上传失败 ' + r.status);   // 422 = 已存在，当成功
}
async function ghGetBlob(path) {
  const r = await api(path + '?ref=' + encodeURIComponent(cfg.branch || 'main'));
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('照片读取失败 ' + r.status);
  const j = await r.json();
  if (j.content) {
    const bin = atob(j.content.replace(/\s/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: 'image/jpeg' });
  }
  // 文件偏大时接口不带内容，改用 blob 接口取原始字节
  const r2 = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/git/blobs/${j.sha}`, {
    headers: { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github.raw' }
  });
  if (!r2.ok) throw new Error('照片读取失败 ' + r2.status);
  return new Blob([await r2.arrayBuffer()], { type: 'image/jpeg' });
}
async function ghDelete(path) {
  const r = await api(path + '?ref=' + encodeURIComponent(cfg.branch || 'main'));
  if (r.status === 404) return;                       // 本来就没有
  if (!r.ok) return;
  const j = await r.json();
  await api(path, { method: 'DELETE', body: JSON.stringify({
    message: '删除照片 ' + path, sha: j.sha, branch: cfg.branch || 'main'
  })});
}

/* 写 index.json（这个文件是「哪天有日记」的总目录，写坏了别的设备就看不到日记了）。
 * 要点：如果在我们读取之后、写入之前，另一台设备也改了目录，不能拿我们手里这份直接盖掉——
 * 那样对方刚记上的日子会从目录里消失。所以遇到冲突就重新读一遍、合并，再写。
 */
async function putIndex(mine, sha, depth) {
  const body = {
    message: '更新目录',
    content: S.b64encode(JSON.stringify(mine, null, 1)),
    branch: cfg.branch || 'main'
  };
  if (sha) body.sha = sha;
  const r = await api('index.json', { method: 'PUT', body: JSON.stringify(body) });
  if (r.ok) return;
  if ((r.status === 409 || r.status === 422) && (depth || 0) < 3) {
    const cur = await ghGet('index.json');                 // 别人抢先写了，拿最新的来合
    const theirs = cur ? JSON.parse(cur.text) : {};
    return putIndex(S.mergeIndex(theirs, mine), cur ? cur.sha : null, (depth || 0) + 1);
  }
  throw new Error('目录写入失败 ' + r.status);
}

/* 某一天的照片清单同步：清单取并集，删掉的用墓碑挡住，图片文件本身按需收发 */
async function syncImgs(d, remote) {
  const m = getMeta(d);
  const r = remote[d] || {};
  const merged = S.mergeImgs(m.imgs, m.gone, r.imgs, r.gone);
  let moved = 0;

  for (const name of merged.imgs) {
    const path = S.imgPath(d, name);
    if (!(await imgGet(name))) {                      // 别的设备加的，拿下来
      const blob = await ghGetBlob(path);
      if (blob) { await imgPut(name, blob); moved++; }
    } else if (!(r.imgs || []).includes(name)) {      // 本机加的，传上去
      const blob = await imgGet(name);
      await ghPutBlob(path, blob);
      moved++;
    }
  }
  for (const name of merged.gone) {
    if ((r.imgs || []).includes(name)) { await ghDelete(S.imgPath(d, name)); moved++; }
    await imgDel(name);
  }

  const changed = JSON.stringify(merged.imgs) !== JSON.stringify(r.imgs || [])
               || JSON.stringify(merged.gone) !== JSON.stringify(r.gone || []);
  m.imgs = merged.imgs; m.gone = merged.gone;
  setMeta(d, m);
  if (changed) {
    remote[d] = Object.assign({}, r, { t: r.t || m.t || Date.now(), imgs: merged.imgs });
    if (merged.gone.length) remote[d].gone = merged.gone;
  }
  return { changed, moved };
}

/* ================= 同步 ================= */
let syncing = false, syncTimer = null;

function setSync(text, cls) {
  const el = $('syncStatus');
  el.textContent = text;
  el.className = cls || '';
}
function scheduleSync(delay) {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => sync(), delay || 4000);
}

async function sync(manual) {
  if (!cfg.token || !cfg.owner || !cfg.repo) { setSync('未设置云同步 · 点这里设置'); return; }
  if (syncing) return;
  if (!navigator.onLine) { setSync('离线 · 联网后自动同步'); return; }
  syncing = true;
  setSync('同步中…');
  try {
    const idxFile = await ghGet('index.json');
    const remote = idxFile ? JSON.parse(idxFile.text) : {};
    let idxSha = idxFile ? idxFile.sha : null;
    let idxDirty = false;
    let pulled = 0, pushed = 0;

    const dates = new Set([...allDates(), ...Object.keys(remote).filter(S.isDateKey)]);
    for (const d of dates) {
      const m = getMeta(d);
      const lt = m.t || 0, base = m.base || 0;
      const rt = (remote[d] && remote[d].t) || 0;
      const act = S.decide(lt, rt, base);
      if (act === 'none') continue;

      if (act === 'pull') {
        const rf = await ghGet(S.pathOf(d));
        const text = rf ? rf.text : '';
        if (text) localStorage.setItem(TXT(d), text); else localStorage.removeItem(TXT(d));
        const keep = getMeta(d);
        setMeta(d, { t: rt, base: rt, sha: rf ? rf.sha : null,
                     imgs: keep.imgs || [], gone: keep.gone || [] });
        if (d === viewKey) $('editor').value = text;
        pulled++;
      } else {
        let text = getText(d);
        let sha0 = m.sha || null;
        if (act === 'conflict') {
          const rf = await ghGet(S.pathOf(d));
          text = S.mergeText(text, rf ? rf.text : '');
          sha0 = rf ? rf.sha : null;
          localStorage.setItem(TXT(d), text);
          if (d === viewKey) $('editor').value = text;
        }
        const t = Math.max(lt, rt, Date.now());
        const sha = await ghPut(S.pathOf(d), text, sha0, `日记 ${d}`);
        const keep = getMeta(d);
        setMeta(d, { t: t, base: t, sha: sha, imgs: keep.imgs || [], gone: keep.gone || [] });
        remote[d] = Object.assign({}, remote[d], { t: t });   // 别把照片清单覆盖掉
        idxDirty = true;
        pushed++;
      }
    }

    // 照片清单单独过一遍（文件名不会变，所以只合并清单，没有内容冲突）
    let photos = 0;
    for (const d of dates) {
      const m = getMeta(d);
      const r = remote[d] || {};
      if (!(m.imgs || []).length && !(m.gone || []).length
          && !(r.imgs || []).length && !(r.gone || []).length) continue;
      const res = await syncImgs(d, remote);
      if (res.changed) idxDirty = true;
      photos += res.moved;
      if (res.moved && d === viewKey) renderStrip();
    }

    if (idxDirty) await putIndex(remote, idxSha);

    const now = new Date();
    setSync(`已同步 ✓ ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`
            + (pulled ? ` · 收到 ${pulled} 篇` : '') + (pushed ? ` · 上传 ${pushed} 篇` : '')
            + (photos ? ` · 照片 ${photos} 张` : ''), 'ok');
    if ((pulled || photos) && $('calWrap').classList.contains('show')) renderCal();
  } catch (e) {
    setSync('同步失败：' + e.message + ' · 点这里重试', 'err');
  } finally {
    syncing = false;
  }
}

/* ================= 页面 ================= */
let viewKey = todayKey();
let saveTimer = null;

function openPage(key) {
  flushSave();
  viewKey = key;
  showDate(key);
  $('editor').value = getText(key);
  $('saveStatus').textContent = '';
  $('imgHint').textContent = '';
  renderStrip();
  if ($('calWrap').classList.contains('show')) {
    calY = +key.slice(0,4); calM = +key.slice(5,7);
    renderCal();
  }
}
function scheduleSave() {
  $('saveStatus').textContent = '正在保存…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 500);
}
function flushSave() {
  if (!saveTimer) return;
  clearTimeout(saveTimer); saveTimer = null;
  putText(viewKey, $('editor').value);
  $('saveStatus').textContent = '已保存 ✓';
  scheduleSync(4000);
}

/* 跨天：停在「今天」这页时，日期一变就自动进入新的一页 */
setInterval(() => {
  const t = todayKey();
  if (viewKey !== t && $('notTodayTag').style.display === 'none') openPage(t);
}, 20000);
/* 定时同步 */
setInterval(() => sync(), 5 * 60 * 1000);

/* ================= 抽屉 ================= */
function renderDrawer() {
  const byYear = {};
  for (const d of allDates()) {
    if (!hasEntry(d)) continue;
    (byYear[d.slice(0,4)] = byYear[d.slice(0,4)] || []).push(d);
  }
  const years = Object.keys(byYear).sort().reverse();
  const box = $('yearList');
  box.innerHTML = years.length ? '' : '<p style="color:var(--muted);font-size:14px">还没有日记，从今天开始写吧。</p>';
  for (const y of years) {
    byYear[y].sort().reverse();
    const yEl = document.createElement('div');
    yEl.className = 'year';
    yEl.textContent = `${y} 年（${byYear[y].length} 篇）`;
    const daysEl = document.createElement('div');
    daysEl.className = 'days' + (y === viewKey.slice(0,4) ? ' show' : '');
    for (const dk of byYear[y]) {
      const dEl = document.createElement('div');
      dEl.className = 'day' + (dk === viewKey ? ' current' : '');
      const [, m, dd] = dk.split('-');
      const preview = getText(dk).replace(/\s+/g, ' ').slice(0, 12);
      dEl.innerHTML = `${Number(m)}月${Number(dd)}日${dk === todayKey() ? '（今天）' : ''}<span>${preview.replace(/[<>&]/g, '')}</span>`;
      dEl.onclick = () => { toggleDrawer(false); openPage(dk); };
      daysEl.appendChild(dEl);
    }
    yEl.onclick = () => daysEl.classList.toggle('show');
    box.appendChild(yEl); box.appendChild(daysEl);
  }
}
function toggleDrawer(open) {
  $('drawer').classList.toggle('open', open);
  $('mask').classList.toggle('show', open);
}

/* ================= 日历 ================= */
let calY, calM;   // 当前显示的年 / 月（月是 1~12）

function openCal() {
  const [y, m] = viewKey.split('-').map(Number);
  calY = y; calM = m;
  renderCal();
  $('calWrap').classList.add('show');
  $('mask').classList.add('show');
  placeCal();
}
function closeCal() {
  $('calWrap').classList.remove('show');
  if (!$('drawer').classList.contains('open')) $('mask').classList.remove('show');
}
/* 挂在 📅 按钮下方；屏幕窄就居中 */
function placeCal() {
  const w = $('calWrap'), btn = $('calBtn'), r = btn.getBoundingClientRect();
  if (window.innerWidth < 420) {
    w.style.left = '50%'; w.style.transform = 'translateX(-50%)';
    w.style.top = (r.bottom + 8) + 'px'; w.style.right = 'auto';
  } else {
    w.style.transform = 'none';
    w.style.top = (r.bottom + 8) + 'px';
    w.style.left = Math.max(8, Math.min(r.left - 140, window.innerWidth - w.offsetWidth - 8)) + 'px';
    w.style.right = 'auto';
  }
}
function renderCal() {
  const tk = todayKey();
  $('calTitle').textContent = `${calY} 年 ${calM} 月`;
  const weeks = S.monthGrid(calY, calM);
  const body = $('calBody');
  body.innerHTML = '';
  let count = 0;
  for (const week of weeks) {
    const tr = document.createElement('tr');
    for (const dk of week) {
      const td = document.createElement('td');
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (!dk) {
        cell.classList.add('empty');
      } else {
        cell.textContent = Number(dk.slice(8));
        if (hasEntry(dk)) { cell.classList.add('has'); count++; }
        if (dk === tk) cell.classList.add('today');
        if (dk === viewKey) cell.classList.add('sel');
        if (dk > tk) {
          cell.classList.add('future');            // 未来的日子不给点
        } else {
          cell.onclick = () => { closeCal(); openPage(dk); };
        }
      }
      td.appendChild(cell);
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
  $('calCount').textContent = count ? `本月写了 ${count} 天` : '本月还没写过';
}
function moveMonth(delta) {
  const n = S.shiftMonth(calY, calM, delta);
  calY = n.y; calM = n.m;
  renderCal();
}
$('calBtn').onclick = () => $('calWrap').classList.contains('show') ? closeCal() : openCal();
$('calPrev').onclick = () => moveMonth(-1);
$('calNext').onclick = () => moveMonth(1);
$('calTitle').onclick = () => { const t = todayKey(); calY = +t.slice(0,4); calM = +t.slice(5,7); renderCal(); };
$('calToday').onclick = () => { closeCal(); openPage(todayKey()); };
window.addEventListener('resize', () => { if ($('calWrap').classList.contains('show')) placeCal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCal(); });

/* ================= 设置 / 备份 ================= */
$('cfgBtn').onclick = () => {
  $('cfgOwner').value = cfg.owner || '';
  $('cfgRepo').value  = cfg.repo  || '';
  $('cfgToken').value = cfg.token || '';
  $('cfgMsg').textContent = '';
  $('cfgDlg').showModal();
};
$('cfgClose').onclick = () => $('cfgDlg').close();
/* 连不上时，GitHub 对「仓库不存在」和「Token 看不到这个仓库」都回 404，
 * 所以分三步问清楚：Token 本身好不好用 → 它是谁的 → 它能不能看到这个仓库。*/
async function ghDiag(owner, repo, token) {
  const H = { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' };

  const who = await fetch('https://api.github.com/user', { headers: H });
  if (who.status === 401)
    return { ok: false, msg: 'Token 本身无效或已过期。多半是复制时漏了几个字符，或者点了 Generate 之后没保存就关了页面。重新生成一个再试。' };
  if (!who.ok)
    return { ok: false, msg: `Token 验不过（${who.status}）。重新生成一个试试。` };

  const me = (await who.json()).login;
  if (me.toLowerCase() !== owner.toLowerCase())
    return { ok: false, msg: `这个 Token 属于账号「${me}」，但你填的用户名是「${owner}」。把用户名改成 ${me}，或者换用 ${owner} 账号生成的 Token。` };

  const rp = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers: H });
  if (rp.status === 404) {
    // Token 没问题、账号也对，那就是「仓库名不对」或「Token 没勾这个仓库」
    const mine = await fetch('https://api.github.com/user/repos?per_page=100&sort=updated', { headers: H });
    if (mine.ok) {
      const names = (await mine.json()).map(x => x.name);
      const hit = names.find(n => n.toLowerCase() === repo.toLowerCase());
      if (hit && hit !== repo)
        return { ok: false, msg: `仓库名大小写不对，应该是「${hit}」。` };
      if (names.length)
        return { ok: false, msg: `这个 Token 能访问的仓库是：${names.join('、')}。里面没有「${repo}」——要么名字拼错了，要么生成 Token 时没勾到它（Repository access 里重新勾一次）。` };
      return { ok: false, msg: `这个 Token 一个仓库都访问不到。回 Token 设置页，Repository access 选「Only select repositories」并勾上 ${repo}，Permissions 里把 Contents 设成 Read and write。` };
    }
    return { ok: false, msg: `找不到仓库「${owner}/${repo}」。检查仓库名拼写（注意 Diary 和 Dairy 很容易打错），以及生成 Token 时有没有勾上这个仓库。` };
  }
  if (rp.status === 403)
    return { ok: false, msg: '仓库能看到，但 Token 权限不够。回 Token 设置页，把 Permissions → Repository permissions → Contents 设成 Read and write。' };
  if (!rp.ok)
    return { ok: false, msg: '连接失败 ' + rp.status };

  const info = await rp.json();
  if (info.permissions && info.permissions.push === false)
    return { ok: false, msg: 'Token 只有读权限，写不进去。把 Contents 改成 Read and write。' };
  return { ok: true, branch: info.default_branch || 'main' };
}

$('cfgSave').onclick = async () => {
  const clean = s => s.trim().replace(/^["'<]+|["'>]+$/g, '');   // 顺手去掉误复制的引号
  const next = {
    owner: clean($('cfgOwner').value),
    repo:  clean($('cfgRepo').value).replace(/\.git$/, '').replace(/\/+$/, ''),
    token: clean($('cfgToken').value),
    branch: cfg.branch || 'main'
  };
  if (!next.owner || !next.repo || !next.token) { $('cfgMsg').textContent = '三项都要填。'; return; }
  // 有人会把整个仓库网址贴进来，帮他拆开
  const m = next.repo.match(/github\.com\/([^/]+)\/([^/]+)/);
  if (m) { next.owner = m[1]; next.repo = m[2]; }

  const old = cfg; cfg = next;
  $('cfgMsg').textContent = '检查中…';
  try {
    const res = await ghDiag(cfg.owner, cfg.repo, cfg.token);
    if (!res.ok) { cfg = old; $('cfgMsg').textContent = '✗ ' + res.msg; return; }
    cfg.branch = res.branch;
    localStorage.setItem(CFG, JSON.stringify(cfg));
    $('cfgMsg').textContent = '✓ 连上了，开始同步…';
    $('cfgDlg').close();
    sync(true);
  } catch (e) {
    cfg = old;
    $('cfgMsg').textContent = '✗ 连接出错：' + e.message;
  }
};
$('cfgExport').onclick = () => {
  flushSave();
  const data = {};
  for (const d of allDates()) if (getText(d)) data[d] = getText(d);
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `日记备份-${todayKey()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
$('cfgImport').onclick = () => $('cfgFile').click();
$('cfgFile').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    let n = 0;
    for (const [k, v] of Object.entries(data)) {
      if (S.isDateKey(k) && typeof v === 'string' && v) {
        const cur = getText(k);
        putText(k, cur ? S.mergeText(cur, v) : v);   // 已有内容不覆盖，两份都留着
        n++;
      }
    }
    $('cfgMsg').textContent = `✓ 导入了 ${n} 篇，正在同步到云端…`;
    openPage(viewKey);
    renderDrawer();
    sync(true);
  } catch { $('cfgMsg').textContent = '✗ 文件格式不对，请选导出的备份 .json'; }
  e.target.value = '';
};

/* ================= 启动 ================= */
$('editor').addEventListener('input', scheduleSave);
$('todayBtn').onclick = () => openPage(todayKey());
$('listBtn').onclick = () => { renderDrawer(); toggleDrawer(true); };
$('mask').onclick = () => { toggleDrawer(false); closeCal(); };
$('syncStatus').onclick = () => cfg.token ? sync(true) : $('cfgBtn').click();
window.addEventListener('online', () => sync());
window.addEventListener('beforeunload', flushSave);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) flushSave();
  else { const t = todayKey(); if (viewKey !== t && $('notTodayTag').style.display === 'none') openPage(t); sync(); }
});

openPage(todayKey());
sync();

if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
